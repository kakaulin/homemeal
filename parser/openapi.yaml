openapi: 3.0.0
info:
  title: Home Meal price API
  version: 2.0.0
  description: |
    Цены Новосибирска: Магнит (Выборная, 87/3) и Гипер Лента (Большевистская, 52/1).
    Все данные хранятся в Yandex Object Storage; синхронизация запускается таймером
    или вручную через /admin/sync.
servers:
  - url: https://your-api-gateway-url

x-yc-apigateway:
  cors:
    origin: "*"
    methods: "*"
    allowedHeaders: "*"

paths:
  /get-price:
    get:
      operationId: getPrice
      summary: Цены по цели из targets.json (обратная совместимость)
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: store
          in: query
          required: false
          schema:
            type: string
            enum: [magnit, lenta, all]
        - name: shopCode
          in: query
          required: false
          schema:
            type: string
            default: "543371"
      responses:
        "200":
          description: Цены найдены
        "502":
          description: Магазины не ответили
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${env.YC_FUNCTION_ID}
        service_account_id: ${env.YC_SA_ID}

  /auth/google:
    post:
      operationId: authGoogle
      summary: Обмен Google ID token на сессионный JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
      responses:
        "200":
          description: Токен сессии и профиль
        "401":
          description: Google ID token не прошёл проверку
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${env.YC_FUNCTION_ID}
        service_account_id: ${env.YC_SA_ID}

  /admin/products:
    get:
      operationId: adminProducts
      summary: Каталог для админки (товары с ошибками — сверху)
      responses:
        "200":
          description: Список товаров
        "401":
          description: Нет токена
        "403":
          description: Не администратор
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${env.YC_FUNCTION_ID}
        service_account_id: ${env.YC_SA_ID}
    post:
      operationId: adminCreateProduct
      summary: Создать товар и сразу подтянуть цены
      responses:
        "201":
          description: Товар создан
        "401":
          description: Нет токена
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${env.YC_FUNCTION_ID}
        service_account_id: ${env.YC_SA_ID}

  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Идентификатор товара
        schema:
          type: string
    put:
      operationId: adminUpdateProduct
      summary: Обновить товар
      responses:
        "200":
          description: Товар обновлён
        "404":
          description: Товар не найден
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${env.YC_FUNCTION_ID}
        service_account_id: ${env.YC_SA_ID}
    delete:
      operationId: adminDeleteProduct
      summary: Удалить товар
      responses:
        "200":
          description: Товар удалён
        "404":
          description: Товар не найден
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${env.YC_FUNCTION_ID}
        service_account_id: ${env.YC_SA_ID}

  /admin/lookup:
    post:
      operationId: adminLookup
      summary: Поиск товара по тексту, ссылке или ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [store, queryOrUrl]
              properties:
                store:
                  type: string
                  enum: [magnit, lenta]
                queryOrUrl:
                  type: string
      responses:
        "200":
          description: Кандидаты с весом и КБЖУ
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${env.YC_FUNCTION_ID}
        service_account_id: ${env.YC_SA_ID}

  /admin/sync:
    post:
      operationId: adminSync
      summary: Пересчитать цены (все или один товар)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
      responses:
        "200":
          description: Сводка синхронизации
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${env.YC_FUNCTION_ID}
        service_account_id: ${env.YC_SA_ID}
